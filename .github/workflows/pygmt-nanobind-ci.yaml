name: PyGMT Nanobind CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'pygmt_nanobind_benchmark/**'
      - '.github/workflows/pygmt-nanobind-ci.yaml'
      - 'justfile'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, develop ]
    paths:
      - 'pygmt_nanobind_benchmark/**'
      - '.github/workflows/pygmt-nanobind-ci.yaml'
      - 'justfile'
  workflow_dispatch:

env:
  GMT_INCLUDE_DIR: /usr/include/gmt

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build and Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgmt-dev \
          gmt \
          gmt-dcw \
          gmt-gshhg \
          cmake \
          ninja-build \
          ghostscript

    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Build package
      run: |
        just gmt-build

    - name: Run tests
      run: |
        just gmt-test

  compatibility-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Compatibility Test (PyGMT API)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgmt-dev \
          gmt \
          gmt-dcw \
          gmt-gshhg \
          cmake \
          ninja-build \
          ghostscript

    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Build package
      run: |
        just gmt-build

    - name: Run compatibility tests
      working-directory: pygmt_nanobind_benchmark
      run: |
        uv run --locked --all-extras --group lint pytest tests/ -v -k "not benchmark"

  validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Validation (PyGMT Output Compatibility)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgmt-dev \
          gmt \
          gmt-dcw \
          gmt-gshhg \
          cmake \
          ninja-build \
          ghostscript

    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Build package
      run: |
        just gmt-build

    - name: Run validation suite
      run: |
        just gmt-validate

    - name: Upload validation results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: validation-results
        path: pygmt_nanobind_benchmark/output/validation/

  benchmark:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Performance Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgmt-dev \
          gmt \
          gmt-dcw \
          gmt-gshhg \
          cmake \
          ninja-build \
          ghostscript

    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Build package
      run: |
        just gmt-build

    - name: Run comprehensive benchmark
      run: |
        just gmt-benchmark > pygmt_nanobind_benchmark/benchmark_results.txt
        cat pygmt_nanobind_benchmark/benchmark_results.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: benchmark-results
        path: pygmt_nanobind_benchmark/benchmark_results.txt

  code-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: '3.11'

    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmt-dev gmt gmt-dcw gmt-gshhg ghostscript cmake ninja-build

    - name: Build package
      run: just gmt-build

    - name: Run code quality checks
      run: |
        just gmt-check
